<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap');
#woc-preview{--w-red:#ab0c2f;--w-cream:#f6f4ee;--w-ink:#161613;--w-muted:#57595f;--w-line:#e4e2dc;font:14px/1.55 Outfit,Arial,sans-serif;color:var(--w-ink);color-scheme:light}
#woc-preview *{box-sizing:border-box}#woc-preview button,#woc-preview input,#woc-preview select,#woc-preview textarea{font:inherit}#woc-preview button{cursor:pointer}#woc-preview h1,#woc-preview h2,#woc-preview h3,#woc-preview p{margin:0}#woc-preview h1{font-size:34px;line-height:1.12;letter-spacing:-.035em}#woc-preview h2{font-size:24px;letter-spacing:-.025em}#woc-preview h3{font-size:18px}#woc-preview p{color:var(--w-muted)}#woc-preview .w-picker{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;padding-right:90px}#woc-preview .w-picker button{border:1px solid var(--w-line);background:white;border-radius:6px;padding:7px 11px;color:var(--w-muted)}#woc-preview .w-picker button[aria-pressed=true]{background:var(--w-red);color:white;border-color:var(--w-red)}
#woc-preview .w-window{background:white;border:1px solid var(--w-line);border-radius:14px;overflow:hidden}#woc-preview .w-ribbon{background:var(--w-red);color:white;padding:8px 24px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.08em}#woc-preview .w-header{padding:20px 27px;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--w-line)}#woc-preview .w-logo{font-size:25px;font-weight:700;line-height:1;letter-spacing:-.04em}#woc-preview .w-logo small{display:block;font-size:8px;letter-spacing:.3em;margin-top:8px;font-weight:400}#woc-preview .w-header p{font-size:12px}#woc-preview .w-btn{border:1px solid var(--w-red);background:var(--w-red);color:white;padding:11px 18px;border-radius:5px;font-weight:500}#woc-preview .w-btn.secondary{background:transparent;color:var(--w-red)}#woc-preview .w-link{border:0;background:none;color:var(--w-red);padding:8px 0;text-align:left}#woc-preview .w-eyebrow{font:italic 15px Georgia,serif;color:var(--w-red);text-transform:uppercase;margin-bottom:13px}#woc-preview .w-body{padding:36px}#woc-preview .w-lead{max-width:600px;margin-top:13px}#woc-preview .w-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:26px}#woc-preview .w-panel{background:white;border:1px solid var(--w-line);border-radius:12px;padding:23px}#woc-preview .w-panel p{margin-top:8px;font-size:13px}#woc-preview .w-panel h3{margin-top:12px}#woc-preview .w-panel .w-btn{margin-top:20px}#woc-preview .w-icon{color:var(--w-red)}#woc-preview .w-note{background:var(--w-cream);border-left:2px solid var(--w-red);padding:12px 15px;margin:20px 0;color:var(--w-muted);font-size:12px}#woc-preview .w-register{display:grid;grid-template-columns:31% 1fr}#woc-preview .w-story{background:var(--w-cream);padding:35px 25px;display:flex;flex-direction:column;justify-content:space-between;gap:45px}#woc-preview .w-story h2{font-size:30px;line-height:1.15}#woc-preview .w-steps{display:grid;gap:16px;color:var(--w-muted);font-size:12px}#woc-preview .w-form{padding:32px}#woc-preview .w-fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}#woc-preview label{display:block;font-size:12px;font-weight:500}#woc-preview input:not([type=checkbox]),#woc-preview select,#woc-preview textarea{display:block;width:100%;padding:10px 12px;margin-top:6px;border:1px solid var(--w-line);border-radius:5px;background:white;color:var(--w-ink);min-width:0}#woc-preview textarea{resize:vertical;min-height:94px}#woc-preview input:focus,#woc-preview select:focus,#woc-preview textarea:focus{outline:2px solid var(--w-red);outline-offset:2px}#woc-preview .w-full{grid-column:1/-1}#woc-preview .w-check{display:flex;align-items:start;gap:8px;font-size:11px;margin:17px 0}#woc-preview .w-check input{margin-top:3px}#woc-preview .w-shell{display:grid;grid-template-columns:200px minmax(0,1fr)}#woc-preview .w-sidebar{background:var(--w-cream);padding:24px 14px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--w-line)}#woc-preview .w-sidebar p{font-size:10px;letter-spacing:.13em;text-transform:uppercase;margin:0 12px 13px}#woc-preview .w-sidebar button{border:0;background:transparent;padding:11px 12px;color:var(--w-muted);border-radius:5px;text-align:left;font-size:12px}#woc-preview .w-sidebar button[aria-current=page]{background:white;color:var(--w-red);font-weight:600;box-shadow:0 2px 7px #16161308}#woc-preview .w-main{background:#fcfbf8;padding:28px;min-width:0;min-height:520px}#woc-preview .w-mainhead{display:flex;justify-content:space-between;align-items:start;gap:16px;flex-wrap:wrap}#woc-preview .w-mainhead h1{font-size:29px}#woc-preview .w-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:23px 0}#woc-preview .w-stat{border:1px solid var(--w-line);background:white;padding:17px;border-radius:10px}#woc-preview .w-stat strong{display:block;font-size:29px;color:var(--w-red)}#woc-preview .w-stat span{font-size:11px;color:var(--w-muted)}#woc-preview .w-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:16px 0;border-bottom:1px solid var(--w-line)}#woc-preview .w-row:last-child{border:0}#woc-preview .w-row p{font-size:11px;margin-top:4px}#woc-preview .w-badge{font-size:10px;border-radius:4px;padding:4px 8px;background:var(--w-cream);color:var(--w-red);white-space:nowrap}#woc-preview .w-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px}#woc-preview .w-meter{height:6px;background:var(--w-cream);border-radius:5px;margin-top:12px;overflow:hidden}#woc-preview .w-meter span{display:block;height:100%;width:67%;background:var(--w-red)}#woc-preview .w-filter{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}#woc-preview .w-filter input{flex:2;min-width:140px}#woc-preview .w-filter select{flex:1;width:auto}#woc-preview .w-post{max-width:800px;margin:auto}#woc-preview .w-formsection{padding-top:24px;margin-top:24px;border-top:1px solid var(--w-line)}#woc-preview .w-status{padding:14px;background:var(--w-cream);color:var(--w-red);margin-top:18px;border-radius:6px}#woc-preview .w-small{font-size:11px}#woc-preview .w-enter{animation:woc-enter .25s ease-out}@keyframes woc-enter{from{opacity:.5;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){#woc-preview .w-enter{animation:none}}@media(max-width:680px){#woc-preview .w-register{grid-template-columns:1fr}#woc-preview .w-story{display:none}#woc-preview .w-shell{grid-template-columns:1fr}#woc-preview .w-sidebar{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--w-line);padding:10px}#woc-preview .w-sidebar p{display:none}#woc-preview .w-grid,#woc-preview .w-stats{grid-template-columns:1fr}#woc-preview .w-fields{grid-template-columns:1fr}#woc-preview .w-body,#woc-preview .w-form,#woc-preview .w-main{padding:23px 18px}#woc-preview .w-header{padding:18px}#woc-preview .w-ribbon{padding:8px 15px}#woc-preview .w-picker{padding-right:0}#woc-preview .w-header p{display:none}}
</style>
<div id="woc-preview">
 <div class="w-picker" role="group" aria-label="Preview screens"></div>
 <div class="w-window"><div class="w-ribbon"><span>BE THE CHANGE. BUILD YOUR FUTURE.</span><span>DESIGN PREVIEW · SAMPLE DATA</span></div><header class="w-header"><div class="w-logo">≋ WOC<small>WIND OF CHANGE</small></div><p id="woc-portal-label">One community. Different possibilities.</p><button type="button" class="w-link" data-screen="0">Choose your portal ↗</button></header><div id="woc-screen" class="w-enter"></div></div>
</div>
<script>
(()=>{
const root=document.getElementById('woc-preview'),stage=root.querySelector('#woc-screen'),picker=root.querySelector('.w-picker');
const screens=['Join community','Student registration','College registration','Company registration','Student dashboard','College dashboard','Company dashboard','Super Admin dashboard','Post a job','Post an internship'];
let current=0,section='Overview';const drafts={};
const icon=n=>`<i class="w-icon" data-lucide="${n}" aria-hidden="true"></i>`;
const field=(name,placeholder='',type='text',full=false)=>`<label class="${full?'w-full':''}">${name}<input type="${type}" placeholder="${placeholder}" ${name.includes('*')?'required':''}></label>`;
const select=(name,options)=>`<label>${name}<select>${options.map(x=>`<option>${x}</option>`).join('')}</select></label>`;
const area=(name,placeholder)=>`<label class="w-full">${name}<textarea placeholder="${placeholder}" ${name.includes('*')?'required':''}></textarea></label>`;
const row=(title,sub,badge,action='')=>`<div class="w-row"><div><strong>${title}</strong><p>${sub}</p></div><span class="w-badge">${badge}</span>${action}</div>`;
const button=(text,to,secondary=false)=>`<button type="button" class="w-btn ${secondary?'secondary':''}" data-screen="${to}">${text}</button>`;
const stats=items=>`<div class="w-stats">${items.map(([n,l])=>`<div class="w-stat"><strong>${n}</strong><span>${l}</span></div>`).join('')}</div>`;
function join(){return `<div class="w-body" style="background:var(--w-cream)"><div class="w-eyebrow">FIND YOUR PLACE</div><h1>Join our community.</h1><p class="w-lead">Choose the space that fits your journey. Learn, collaborate and create opportunities with WOC.</p><div class="w-grid">${[['graduation-cap','Student','Build skills. Discover your next step.','Courses, campus activities, certificates and career opportunities.',1],['school','College','Bring opportunity to your campus.','Manage students, training, placements and industry relationships.',2],['building-2','Company','Connect with emerging talent.','Publish jobs and internships through an approved employer account.',3]].map(([i,t,h,d,n])=>`<article class="w-panel">${icon(i)}<h3>Join as ${t}</h3><p><strong>${h}</strong></p><p>${d}</p>${button('Continue as '+t+' →',n)}</article>`).join('')}</div><p class="w-small" style="margin-top:24px">Already a member? <button class="w-link" data-local="Use the existing WOC login. Backend role metadata chooses your portal after sign-in.">Sign in</button> · Super Admin access is invitation-only.</p><div id="woc-feedback" aria-live="polite"></div></div>`}
function registration(role){const student=role==='Student',college=role==='College';let fields=field(student?'Full name *':'Administrator full name *','Your full name')+field('Email address *',student?'you@example.com':'administrator@organization.edu','email')+field('Mobile number','+91 · Contact number','tel')+field('Password *','Create a strong password','password');
if(student)fields+=field('Age *','18','number')+field('Institution','Search your college')+field('Course / qualification','B.E. Computer Science')+field('Graduation year','2027','number')+field('Skills and interests','Python, design, data')+area('Career goals','What would you like to learn or become?');
else fields+=field(college?'Institution name *':'Legal company name *',college?'Your institution':'Your company')+field('Official website *','https://organization.example','url')+field('Official contact email *','office@organization.example','email')+field('Official contact phone','Institution or company contact','tel')+field('City *','Chennai')+field('State / region','Tamil Nadu')+(college?field('Affiliation / institution code','University affiliation and institution ID')+area('Institution address *','Official campus address'):field('Industry *','Software & technology')+select('Company size',['Select size','1–10','11–50','51–200','201–500','500+'])+field('Recruitment email','careers@organization.example','email')+field('Careers website','https://organization.example/careers','url')+area('Company description *','About your organization and the opportunities you offer.'))+field('Verification reference / document','Official registration or authorization proof','file',true);
return `<div class="w-register"><aside class="w-story"><div><div class="w-eyebrow">${student?'YOUR NEXT CHAPTER':'BUILD WITH WOC'}</div><h2>${student?'Learn.<br>Connect.<br>Grow.':college?'Empower your<br>entire campus.':'Opportunity<br>starts with you.'}</h2></div><div class="w-steps"><span>01 · Create your administrator identity</span><span>02 · ${student?'Complete your student profile':'Submit official organization details'}</span><span>03 · ${student?'Request college affiliation when needed':'Super Admin verifies and approves'}</span></div></aside><form class="w-form" data-registration="${role}"><div class="w-eyebrow">JOIN AS ${role.toUpperCase()}</div><h1>${student?'Find your place.':college?'Connect your institution.':'Meet your future talent.'}</h1><p class="w-lead">${student?'Your learning, community and opportunities in one place.':'One administrator initially. Organization access starts after approval.'}</p><div class="w-fields">${fields}</div>${student?'<label class="w-check"><input type="checkbox">For under-18 participation, I confirm school and guardian permission.</label>':''}<label class="w-check"><input type="checkbox" required>I agree to the Terms and Privacy Notice${student?'':', and confirm I am authorized to represent this organization'}.</label><div class="w-note">${student?'Email / Google authentication and existing verification rules remain unchanged. College affiliation is a separate approval.':'Official email and organization evidence are reviewed by Super Admin. Pending accounts see registration status and cannot manage the portal.'}</div><button class="w-btn" type="submit">${student?'Create student account':'Submit '+role.toLowerCase()+' for verification'} →</button><div id="woc-feedback" aria-live="polite"></div></form></div>`}
const menus={Student:['Overview','Profile & education','Learning & training','Jobs & internships','Certificates','Campus activities','Public website'],College:['Overview','Institution profile','Students','Affiliation requests','Training & batches','Campus placements','Corporate partnerships','Events & clubs','Leadership'],Company:['Overview','Company profile','Post a job','Post an internship','Manage opportunities','Moderation status','College partnerships'], 'Super Admin':['Overview','Account management','College verification','Company verification','Opportunity moderation','Platform statistics','Action history']};
function dashboard(role){let student=role==='Student',college=role==='College',company=role==='Company';let title=student?'Welcome back, Arjun.':college?'Your campus, connected.':company?'Build your next team.':'Platform overview.';let body='';
if(section==='Overview'){
body=stats(student?[['2','Courses in progress'],['3','Saved opportunities'],['1','Upcoming campus event']]:college?[['128','Active students'],['4','Training batches'],['12','Confirmed placements']]:company?[['3','Published opportunities'],['2','Awaiting moderation'],['1','Draft opportunity']]:[['128','Student accounts'],['6','Verified colleges'],['8','Approved companies']]);
body+=`<div class="w-panel"><h3>${student?'Continue learning':college?'Campus updates':company?'Your opportunities':'Approval queue'}</h3>${student?row('Python Full Stack','Learning · 2 of 3 lessons completed','In progress')+'<div class="w-meter" aria-label="67 percent complete"><span></span></div>'+row('Frontend Developer Intern','Acme Technologies · Hybrid','Saved'):college?row('Student affiliation requests','4 students awaiting confirmation','Needs review')+row('Python Full Stack · Batch A','24 students · Existing WOC course','In progress'):company?row('Frontend Developer','Engineering · Full-time · Chennai','Published')+row('Data Analyst Intern','Analytics · 6 months · Hybrid','Pending review')+row('Product Designer','Design · Remote','Draft'):row('Meridian College','Institution verification · Official contact submitted','Pending')+row('Acme Technologies','Company verification · Authorization submitted','Pending')+row('Frontend Developer','Opportunity moderation · Acme Technologies','Pending review')}</div>`;
}else if(section==='Account management'){body=`<div class="w-filter"><input aria-label="Search accounts" placeholder="Search name or email"><select aria-label="Role"><option>All roles</option><option>Student</option><option>College</option><option>Company</option></select><select aria-label="Status"><option>All statuses</option><option>Active</option><option>Suspended</option></select></div><div class="w-panel">${row('Arjun Kumar','arjun@example.com · Student','Active','<button class="w-link" data-toggle-account>Suspend</button>')+row('Priya Raman','admin@meridian.example · College Admin','Active','<button class="w-link" data-toggle-account>Suspend</button>')+row('Rahul Menon','talent@acme.example · Company Admin','Suspended','<button class="w-link" data-toggle-account>Activate</button>')}</div><div class="w-actions"><button class="w-btn secondary" disabled>Previous</button><span>Page 1 of 1</span><button class="w-btn secondary" disabled>Next</button></div>`;
}else if(section==='Company profile'||section==='Institution profile'||section==='Profile & education'){body=`<form data-local-form class="w-panel"><div class="w-fields">${field('Name *',student?'Arjun Kumar':college?'Meridian College':'Acme Technologies')+field('Contact email *','office@example.com','email')+field(student?'Qualification':'Official website','')+field(student?'Graduation year':'City','')+area(student?'Skills and career goals':'About your organization','Update your profile')}</div><div class="w-actions"><button class="w-btn">Save profile</button></div></form>`;
}else if(section==='College partnerships'&&company){body=`<div class="w-panel"><h3>Connected institutions</h3><p>College-managed relationships, shown here as a proposed read-only employer view.</p>${row('Meridian College','Recruitment & training · Managed by college','Active')}</div><div class="w-note">Company-side partnership APIs are proposed. No partnership creation or approval is simulated.</div>`;
}else{const entries={ 'Learning & training':[['Python Full Stack','WOC Academy · Continue your assigned course','In progress'],['Data Analytics','College training batch · Starts 12 Dec','Assigned']], 'Jobs & internships':[['Frontend Developer Intern','Acme Technologies · Apply through official careers site','External application'],['Data Analyst','Example Industries · Apply through recruitment email','External application']], Certificates:[['Python Foundations','Completion verified by WOC','Issued']], 'Campus activities':[['Innovation Meetup','Campus event · 12 Dec','Open'],['Coding Club','Weekly peer learning','Member']],Students:[['Arjun Kumar','Computer Science · 2027','Active'],['Meera Nair','Information Technology · 2027','Active']], 'Affiliation requests':[['Kavin Raj','Computer Science · Student requests this college','Pending']], 'Training & batches':[['Python Full Stack · Batch A','Existing WOC course · 24 students','In progress']], 'Campus placements':[['Arjun Kumar → Acme Technologies','Frontend Developer · Confirmed by college','Accepted']], 'Corporate partnerships':[['Acme Technologies','Recruitment & training relationship','Active']], 'Events & clubs':[['Innovation Meetup','Workshop · Capacity 60','Upcoming'],['Coding Club','Student-led campus community','Active']], Leadership:[['Meera Nair','Campus Ambassador · Assigned by college','Active']], 'Manage opportunities':[['Frontend Developer','Full-time · Chennai','Published'],['Data Analyst Intern','6 months · Hybrid','Pending review']], 'Moderation status':[['Data Analyst Intern','Submitted for Super Admin review','Pending review'],['Frontend Developer','Material edits require another review','Approved']], 'College verification':[['Meridian College','Official contact and institution details','Pending']], 'Company verification':[['Acme Technologies','Official website and authorization','Pending']], 'Opportunity moderation':[['Frontend Developer','Acme Technologies · Review full posting','Pending review']], 'Platform statistics':[['Student accounts','Excludes organization administrators','128'],['External application clicks','Clicks are not completed applications or placements','42']], 'Action history':[['Company approved','Super Admin · 26 Nov, 10:32','Audit event'],['Account suspended','Super Admin · 26 Nov, 10:40','Audit event']]};body=`<div class="w-panel">${(entries[section]||[]).map(([a,b,c])=>row(a,b,c)).join('')}${!entries[section]?'<p>Return to the public WOC website to explore programs and community stories.</p>':''}</div>`;
if(['Affiliation requests','College verification','Company verification','Opportunity moderation'].includes(section))body+=`<div class="w-actions"><button class="w-btn" data-local="Approved in this preview only. No account or record was changed.">Approve</button><button class="w-btn secondary" data-local="Rejected in this preview only. A reason will be recorded in the real workflow.">Reject</button></div>`;
if(section==='Jobs & internships')body+='<div class="w-note">Applications go directly to company email / HTTPS careers website. Saved items and student-reported statuses remain separate from confirmed placements.</div>';
}
return `<div class="w-shell"><aside class="w-sidebar"><p>${role} portal</p>${menus[role].map(m=>`<button aria-current="${m===section?'page':'false'}" data-menu="${m}">${m}</button>`).join('')}</aside><main class="w-main"><div class="w-mainhead"><div><div class="w-eyebrow">${role.toUpperCase()} PORTAL</div><h1>${section==='Overview'?title:section}</h1><p class="w-lead">${student?'Your learning. Your community. Your next step.':college?'Meridian College · Verified institution':company?'Acme Technologies · Approved company':'WOC administration · Restricted access'}</p></div>${company?button('Post an opportunity +',8):''}</div>${body}<div id="woc-feedback" aria-live="polite"></div></main></div>`}
function posting(intern){return `<div class="w-shell"><aside class="w-sidebar"><p>Company portal</p>${menus.Company.map(m=>`<button data-menu="${m}" aria-current="${m===(intern?'Post an internship':'Post a job')?'page':'false'}">${m}</button>`).join('')}</aside><main class="w-main"><div class="w-post"><div class="w-eyebrow">CREATE AN OPPORTUNITY</div><h1>${intern?'Post an internship.':'Post a job.'}</h1><p class="w-lead">Reach students through WOC. Every posting is reviewed before publication.</p><form id="woc-posting"><div class="w-actions"><label>Opportunity type<select id="woc-post-type"><option ${!intern?'selected':''}>Job</option><option ${intern?'selected':''}>Internship</option></select></label><span class="w-badge">Draft · Not publicly visible</span></div><div class="w-formsection"><h3>Role & responsibilities</h3><div class="w-fields">${field((intern?'Internship':'Job')+' title *',intern?'Data Analyst Intern':'Frontend Developer')+field('Department *',intern?'Analytics':'Engineering')+area('Description and responsibilities *','Describe the role, day-to-day responsibilities and expected outcomes.')+field('Required skills *','Python, SQL, communication')+field('Educational qualification *','B.E. / B.Tech / B.Sc. Computer Science')+select('Experience *',intern?['Student / no prior experience','Prior internship preferred']:['Fresher','0–1 years','1–3 years','3+ years'])+field('Eligible graduation year','2026, 2027, 2028')}</div></div><div class="w-formsection"><h3>Location & engagement</h3><div class="w-fields">${field('Location *','Chennai, Tamil Nadu')+select('Work mode *',['On-site','Remote','Hybrid'])+select('Employment type *',intern?['Full-time internship','Part-time internship']:['Full-time','Part-time','Contract'])+field('Number of vacancies *','5','number')+(intern?select('Stipend type *',['Paid','Unpaid'])+field('Monthly stipend *','₹15,000 – ₹20,000')+field('Internship duration *','6 months'):field('Salary package *','₹4–6 LPA'))+field('Application deadline *','','date')}</div></div><div class="w-formsection"><h3>Selection & benefits</h3><div class="w-fields">${area('Selection process','Example: Portfolio review → Technical discussion → Final conversation')+area('Benefits',intern?'Mentorship, practical projects, completion certificate':'Learning allowance, flexible work, health coverage')}</div></div><div class="w-formsection"><h3>Where should students apply?</h3><p class="w-small">Provide at least one official application channel. WOC does not collect applications.</p><div class="w-fields">${field('Recruitment email','careers@acme.example','email')+field('External application URL','https://acme.example/careers','url')}</div></div><div class="w-note">Submitting sends this posting to Super Admin. Editing an approved posting requires re-moderation. Application clicks do not count as completed applications.</div><div class="w-actions"><button type="button" class="w-btn secondary" id="woc-save-draft">Save as Draft</button><button type="submit" class="w-btn">Submit for Review →</button></div><div id="woc-feedback" aria-live="polite"></div></form></div></main></div>`}
function feedback(text){const el=root.querySelector('#woc-feedback');if(el){el.className='w-status';el.textContent=text;}}
function render(n=current){current=n;root.querySelector('#woc-portal-label').textContent=n<4?'One community. Different possibilities.':n===4?'Student workspace':n===5?'Institution workspace':n===7?'Platform administration':'Employer workspace';picker.innerHTML=screens.map((s,i)=>`<button type="button" aria-pressed="${i===n}" data-screen="${i}">${s}</button>`).join('');stage.innerHTML=n===0?join():n<4?registration(['','Student','College','Company'][n]):n<8?dashboard(['Student','College','Company','Super Admin'][n-4]):posting(n===9);stage.classList.remove('w-enter');void stage.offsetWidth;stage.classList.add('w-enter');if(globalThis.lucide)lucide.createIcons();}
root.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.screen!==undefined){section='Overview';render(Number(t.dataset.screen));}else if(t.dataset.menu){const m=t.dataset.menu;if(m==='Post a job')render(8);else if(m==='Post an internship')render(9);else{if(current>=8)current=6;section=m;render();}}else if(t.dataset.local)feedback(t.dataset.local);else if(t.id==='woc-save-draft'){feedback('Draft saved in this preview only. Nothing was sent to WOC.');}else if(t.hasAttribute('data-toggle-account')){const badge=t.parentElement.querySelector('.w-badge'),suspend=t.textContent==='Suspend';badge.textContent=suspend?'Suspended':'Active';t.textContent=suspend?'Activate':'Suspend';feedback('Preview account state changed. In production this action requires Super Admin permissions and is audited.');}});
root.addEventListener('change',e=>{if(e.target.id==='woc-post-type')render(e.target.value==='Job'?8:9);if(e.target.closest('.w-filter'))filterAccounts();});
function filterAccounts(){const f=root.querySelector('.w-filter');if(!f)return;const q=f.querySelector('input').value.toLowerCase(),sels=f.querySelectorAll('select');root.querySelectorAll('.w-main .w-row').forEach(r=>{const text=r.textContent.toLowerCase();r.hidden=!(text.includes(q)&&(sels[0].value==='All roles'||text.includes(sels[0].value.toLowerCase()))&&(sels[1].value==='All statuses'||r.querySelector('.w-badge').textContent===sels[1].value));});}
root.addEventListener('input',e=>{if(e.target.closest('.w-filter'))filterAccounts();});
root.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id==='woc-posting'){const email=f.querySelector('input[type=email]').value,url=f.querySelector('input[type=url]').value;if(!email&&!url){feedback('Add a recruitment email or an HTTPS application URL.');return;}if(url&&!url.startsWith('https://')){feedback('Use an HTTPS application URL.');return;}feedback('Pending review · Preview only. The posting is not published or sent to WOC.');}else if(f.dataset.registration){const student=f.dataset.registration==='Student';feedback(student?'Student registration preview complete. Existing verification rules would run before role-based dashboard access.':'Registration submitted in this preview. Status: Pending verification. An approved organization membership is required for portal access.');const b=document.createElement('button');b.type='button';b.className='w-btn';b.dataset.screen=String(student?4:f.dataset.registration==='College'?5:6);b.textContent='Preview approved '+f.dataset.registration.toLowerCase()+' dashboard →';root.querySelector('#woc-feedback').append(document.createElement('br'),b);}else feedback('Profile saved in this preview only. No database was accessed.');});
render();
})();
</script>
